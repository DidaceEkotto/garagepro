name: GaragePro CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  tests-and-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, gd, bcmath
          coverage: none

      - name: Installation des dépendances Composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Audit de sécurité Composer
        run: composer audit

      - name: Préparation de l'environnement de test
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Exécution des tests PHPUnit
        run: php artisan test

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installation des dépendances npm
        run: npm ci

      - name: Audit de sécurité npm
        run: npm audit --audit-level=high

      - name: Compilation des assets Vite
        run: npm run build
